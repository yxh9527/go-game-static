<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <title>GO游戏</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
    content="viewport-fit=cover,width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1" />

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />

  <!-- force screen orientation on some browser -->
  <meta name="screen-orientation" content="" />
  <meta name="x5-orientation" content="">

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <!-- 引擎启动前先接住 web 大厅 postMessage，避免漏掉最早的 openGame -->
  <script src="./js/webHallEarly.js"></script>

  <link rel="icon" href="data:;">
  <!-- <link rel="apple-touch-icon" href="icon.png"> -->
  <link ref="icon" href="logo_pt.dcc16.png">
  <!-- 添加manifest配置 -->
  <link rel="apple-touch-icon" href="icon-512.png">

  <script type="module" crossorigin src="./js/index.js"></script>
  <link rel="stylesheet" crossorigin href="./vue-assets/index.css">
<link rel="manifest" href="./manifest.6a0a1.webmanifest"></head>

<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="app"> </div>
</body>

</html>
